pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
  access_log off;
  client_max_body_size 32m;
  client_body_temp_path /tmp/client-body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_header_timeout 15s;
  client_body_timeout 30s;
  keepalive_timeout 15s;
  large_client_header_buffers 4 32k;
  limit_req_zone $binary_remote_addr zone=login:1m rate=5r/s;
  ssl_certificate /run/argentum/tls.crt;
  ssl_certificate_key /run/argentum/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:1m;
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_read_timeout 70s;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto https;
  server {
    listen 8765 ssl;
    location = /login { limit_req zone=login burst=5 nodelay; proxy_pass http://10.77.0.3:8765; }
    location / { proxy_pass http://10.77.0.3:8765; }
  }
  server {
    listen 8767 ssl;
    location = /login { limit_req zone=login burst=5 nodelay; proxy_pass http://10.77.0.3:8767; }
    location / { proxy_pass http://10.77.0.3:8767; }
  }
  server {
    listen 8788 ssl;
    location = /login { limit_req zone=login burst=5 nodelay; proxy_pass http://10.77.0.3:8788; }
    location / { proxy_pass http://10.77.0.3:8788; }
  }
}
