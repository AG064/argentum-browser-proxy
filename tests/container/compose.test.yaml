services:
  topology:
    build: {context: ., dockerfile: deploy/Dockerfile, target: worker}
    entrypoint: [python, /app/tests/container/topology.py]
    cap_add: [NET_ADMIN]
    networks: {private: {ipv4_address: 10.77.0.2}, internet_fixture: {ipv4_address: 51.77.0.2}}
  broker:
    network_mode: service:topology
    depends_on: [topology, fixtures]
    environment: {ARGENTUM_BROKER_BIND: 10.77.0.2, ARGENTUM_WORKER_IP: 10.77.0.3}
    volumes: [./tests/container/resolv.conf:/etc/resolv.conf:ro]
  worker:
    image: argentum-browser-proxy-worker-fixture
    build: {context: ., dockerfile: deploy/Dockerfile, target: worker}
    environment: {ARGENTUM_BROKER_IP: 10.77.0.2, ARGENTUM_GATEWAY_IP: 10.77.0.4}
  fixtures:
    build: {context: ., dockerfile: deploy/Dockerfile, target: worker}
    entrypoint: [python, /app/tests/container/fixtures.py]
    networks: {private: {ipv4_address: 10.77.0.5}, internet_fixture: {ipv4_address: 51.77.0.4}}
    volumes: [./tests/container/private/provider.crt:/secrets/provider.crt:ro, ./tests/container/private/provider.key:/secrets/provider.key:ro]
networks:
  internet_fixture:
    internal: true
    ipam: {config: [{subnet: 51.77.0.0/24, gateway: 51.77.0.1}]}
